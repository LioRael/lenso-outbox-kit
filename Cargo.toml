[package]
name = "lenso-outbox-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Transactional Outbox lifecycle kit for module-owned Lenso PostgreSQL state"
repository = "https://github.com/LioRael/lenso-outbox-kit"
readme = "README.md"
keywords = ["lenso", "postgresql", "outbox", "events"]
categories = ["database"]

[dependencies]
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "time", "uuid", "json"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1.19", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
