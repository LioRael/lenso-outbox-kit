name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LENSO_OUTBOX_TEST_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Reject user-specific macOS paths
        run: |
          macos_user_root="$(printf '/%s/' Users)"
          if git grep -nF "$macos_user_root"; then
            echo 'Tracked files must not contain user-specific macOS paths.' >&2
            exit 1
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Package
        run: cargo package --locked --allow-dirty
